[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tersuite-ai-studio-backend"
version = "0.1.0"
description = "Enterprise Autonomous Multi-Agent Engineering Platform for WordPress"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Tersuite Engineering Team" }
]
dependencies = [
    "django==5.1.15",
    "djangorestframework==3.17.2",
    "django-cors-headers==4.9.0",
    "psycopg==3.3.4",
    "psycopg-binary==3.3.4",
    "dj-database-url==3.1.2",
    "redis==8.1.0",
    "celery==5.6.3",
    "channels==4.3.2",
    "channels-redis==4.3.0",
    "daphne==4.2.3",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "httpx==0.28.1",
    "openhands-sdk==1.42.1",
    "openhands-tools==1.42.1",
    "openhands-agent-server==1.42.1",
    "openhands-workspace==1.42.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-asyncio==1.4.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--tb=short -ra"
asyncio_mode = "auto"
