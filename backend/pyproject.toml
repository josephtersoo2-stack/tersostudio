[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tersuite-ai-studio-backend"
version = "0.1.0"
description = "Enterprise Autonomous Multi-Agent Engineering Platform for WordPress"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Tersuite Engineering Team" }
]
dependencies = [
    "django>=5.0,<5.2",
    "djangorestframework>=3.15.0",
    "django-cors-headers>=4.3.1",
    "psycopg[binary]>=3.1.18",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "channels>=4.0.0",
    "channels-redis>=4.2.0",
    "daphne>=4.1.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--tb=short -ra"
asyncio_mode = "auto"
